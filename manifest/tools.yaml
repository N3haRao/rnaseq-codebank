# =============================================================================
# manifest/tools.yaml  --  machine-readable description of the code bank
# =============================================================================
# The AI agent reads this file to learn which analyses exist, which parameters
# each one accepts (with types, defaults and allowed values), what each one
# writes, and where to look to answer questions. People can read it too.
#
# Rules for the agent
#   * Run analyses ONLY through these entry points; never write new analysis code.
#   * Start every analysis with `run_pipeline`. It creates a new run folder.
#   * To change a setting after a run, start a NEW run with --based_on <old run>
#     and --set "<param>=<value>"; never edit an existing run folder.
#   * Show the user the proposed condition / reference / test / covariates and
#     wait for confirmation before running steps 2-7.
#   * Answer questions about results from the files listed under `answers`,
#     not from memory.
#   * Never replace a method listed under `methods`. Agents may change the
#     parameters below (covariates, cutoffs, plot colours and shapes, ...), not
#     the statistics: e.g. no edgeR or limma instead of DESeq2. Custom code may
#     only use the methods in `methods.allowed` and must not use
#     `methods.not_allowed`.
#
# Parameter types: path, string, number, integer, bool, enum (one of `values`),
# list (of text; `values` = allowed items), column (a column of the sample
# table), colour (hex such as "#D55E00" or an R colour name).
#
# When you add a script: add an entry under `steps`, list every parameter it
# reads, and add its outputs. Keep `version` in step with R/utils.R.
# =============================================================================

version: 0.7.0
language: R (>= 4.3)
defaults_file: config/default_params.yaml
runs_folder: runs/

entry_points:
  run_pipeline:
    script: scripts/run_pipeline.R
    description: Create a run folder and run steps 1-7 (or a chosen subset).
    command_examples:
      - Rscript scripts/run_pipeline.R --config <run_config.yaml>
      - Rscript scripts/run_pipeline.R --counts_file <counts> --metadata_file <metadata> --condition <col> --reference_level <ref> --test_level <test> --run_name <label>
      - Rscript scripts/run_pipeline.R --config <run_config.yaml> --steps 1       # validation only
      - Rscript scripts/run_pipeline.R --based_on runs/<run_id> --set "log2fc_cutoff=0.58"
      - Rscript scripts/run_pipeline.R --run_dir runs/<run_id> --steps 6-7        # resume, same parameters
    options:
      config:     {type: path, description: Run config YAML with the values that differ from the defaults}
      based_on:   {type: path, description: Earlier run folder whose parameters are copied}
      run_dir:    {type: path, description: Existing run folder to resume (no parameter changes allowed)}
      runs_dir:   {type: path, default: runs/}
      run_name:   {type: string, description: Label in the run folder name}
      steps:      {type: string, default: "1-7", description: "e.g. 1-7, 1, 4-5, 1,2,3"}
      set:        {type: string, description: "Any parameter overrides, 'key=value;key2=[a, b]' (values parsed as YAML)"}
    exit_codes: {0: all critical steps passed, 1: a critical step failed (read the step log)}
    writes:
      - params.yaml          # parameters requested
      - inputs/              # copies of the input files
      - logs/<step>.log      # full console output of each step
      - provenance/<step>.json
      - provenance.json      # code commit, R and package versions, parameters, checksums, timings
      - run_summary.json     # headline results and warnings: read this first
  setup_environment:
    script: scripts/00_setup_environment.R
    description: Install and check packages (--check to only check).
  make_example_data:
    script: scripts/make_example_data.R
    description: Write the airway and pasilla example inputs into data/example/.
  tests:
    script: tests/run_tests.R
    description: End-to-end tests; --skip_enrichment when offline.

steps:
  - id: 1
    name: 01_validate_inputs
    script: scripts/01_validate_inputs.R
    critical: true
    description: >
      Read and check the counts and metadata files, explain problems in plain
      language, resolve open parameters (reference group, organism, ID type,
      filter threshold) and write clean aligned inputs.
    parameters:
      counts_file:        {type: path, required: true}
      metadata_file:      {type: path, required: true}
      gene_id_column:     {type: string, default: null, description: null = first column}
      sample_id_column:   {type: string, default: null, description: null = first column}
      condition:          {type: string, default: condition}
      reference_level:    {type: string, default: null, description: null = guessed from control-like names and flagged}
      test_level:         {type: string, default: null, description: null = the other group when there are exactly 2}
      covariates:         {type: list, default: [], description: Adjusted for in the model; pairing column goes here}
      organism:           {type: enum, values: [auto, human, mouse, other], default: auto}
      exclude_samples:    {type: list, default: [], description: Sample IDs left out of the analysis}
      duplicate_gene_ids: {type: enum, values: [sum, first, error], default: sum}
      round_counts:       {type: bool, default: true}
      min_library_size:   {type: number, default: 1000000}
      min_replicates_warn: {type: integer, default: 3}
      min_count:          {type: integer, default: 10}
      min_samples:        {type: integer, default: null, description: null = size of the smaller compared group}
    outputs:
      validation_report.json: Every check with id, status (pass/warning/fail) and message
      validation_report.md:   Same, readable
      counts_validated.csv:   Clean integer counts
      metadata_validated.csv: Aligned metadata (first column sample_id)
      resolved_params.yaml:   Final parameters used by all later steps
    check_ids: [files_found, counts_readable, gene_id_column, annotation_columns, numeric_columns, excluded_samples, missing_values,
                negative_values, count_values, ensembl_versions, duplicate_gene_ids, all_zero_genes,
                library_sizes, metadata_readable, sample_id_column, duplicate_samples, sample_matching,
                condition_column, condition_values, reference_level, test_level, replicates,
                covariates, design_full_rank, residual_df, level_names, gene_ids_organism]

  - id: 2
    name: 02_qc
    script: scripts/02_qc.R
    critical: true
    description: Library sizes, detected genes, count distributions and per-sample QC flags.
    parameters:
      min_library_size: {type: number}
      min_count: {type: integer}
      min_samples: {type: integer}
      plot_palette:       {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito, description: Group colours in every figure}
      group_colours:      {type: list, default: [], description: "Colour for single groups, entries like WT=#000000"}
    outputs:
      qc_metrics.csv:     One row per sample (library size, detected genes, % zeros, flags)
      qc_summary.json:    Totals, filter result, flags
      library_sizes.png:  Reads per sample
      detected_genes.png: Detected genes per sample
      logcpm_boxplot.png: Expression distribution per sample
      logcpm_density.png: Expression density per sample

  - id: 3
    name: 03_exploratory
    script: scripts/03_exploratory.R
    critical: true
    description: VST (blind), PCA on top variable genes, sample-distance heatmap, mislabel/outlier flags.
    parameters:
      n_top_variable_genes: {type: integer, default: 500}
      plot_palette:       {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito, description: Group colours in every figure}
      group_colours:      {type: list, default: [], description: "Colour for single groups, entries like WT=#000000"}
      pca_colour_by:      {type: column, default: null, description: Sample-table column that colours the PCA; null = the compared groups}
      pca_shape_by:       {type: column, default: null, description: "Column for point shapes (at most 6 values); null = first covariate; none = no shapes"}
      pca_label_samples:  {type: bool, default: true, description: Sample names next to the PCA points}
    outputs:
      pca_plot.png:                PC1 vs PC2 coloured by group (shape = first covariate)
      "pca_by_<covariate>.png":      PC1 vs PC2 coloured by each covariate
      pca_scree.png:               Variance explained per PC
      sample_distance_heatmap.png: Euclidean distances between samples
      pca_coordinates.csv:         PC scores with metadata
      pca_variance.csv:            Percent variance per PC
      outlier_flags.csv:           clusters_with_other_group / far_from_own_group per sample
      exploratory_summary.json:    Variance explained, how much group/covariates explain PC1/PC2, flags
      vst_counts.csv.gz:           VST matrix
      size_factors.csv:            DESeq2 size factors

  - id: 4
    name: 04_differential_expression
    script: scripts/04_differential_expression.R
    critical: true
    description: DESeq2 Wald test, test vs reference, BH-adjusted p-values, shrunken log2FC, annotation.
    parameters:
      padj_cutoff:   {type: number, default: 0.05}
      log2fc_cutoff: {type: number, default: 1, description: Applied to the shrunken log2FC}
      lfc_shrinkage: {type: enum, values: [apeglm, ashr, normal, none], default: apeglm}
      min_count:     {type: integer, default: 10}
      min_samples:   {type: integer}
      seed:          {type: integer, default: 42}
    outputs:
      de_results_all.csv:         "gene_id, gene_symbol, gene_name, entrez_id, baseMean, log2FoldChange (shrunken), lfcSE, log2FoldChange_unshrunken, stat, pvalue, padj, mean_normalized_<ref>, mean_normalized_<test>, significant, direction (up/down/not significant), note"
      de_results_significant.csv: Significant genes only
      normalized_counts.csv:      Size-factor normalised counts
      de_summary.json:            Design, comparison, thresholds, counts, shrinkage used, top genes
      dispersion_plot.png:        DESeq2 dispersion fit
      dds.rds:                    Fitted DESeqDataSet

  - id: 5
    name: 05_de_plots
    script: scripts/05_de_plots.R
    critical: true
    description: Volcano, MA, top-DEG heatmap, p-value histogram.
    parameters:
      n_label_volcano:     {type: integer, default: 15, description: Top genes by padj labelled on the volcano plot}
      volcano_label_genes: {type: list, default: [], description: Label exactly these genes instead (symbols or IDs)}
      n_heatmap_genes:     {type: integer, default: 50}
      up_colour:           {type: colour, default: "#D55E00", description: Genes higher in the test group}
      down_colour:         {type: colour, default: "#0072B2", description: Genes lower in the test group}
      plot_palette:       {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito, description: Group colours in every figure}
      group_colours:      {type: list, default: [], description: "Colour for single groups, entries like WT=#000000"}
    outputs:
      volcano_plot.png: "shrunken log2FC vs -log10 p-value; labels = volcano_label_genes, or the top n_label_volcano"
      ma_plot.png: mean expression vs log2FC
      heatmap_top_degs.png: row z-scores of top DEGs
      pvalue_histogram.png: p-value distribution
      plots_summary.json: "labelled genes, requested genes not found, colours, heatmap details"

  - id: 6
    name: 06_enrichment
    script: scripts/06_enrichment.R
    critical: false
    description: ORA (up and down genes separately) and pre-ranked GSEA with fgsea, per gene-set collection.
    parameters:
      run_enrichment:          {type: bool, default: true}
      gene_set_source:         {type: enum, values: [msigdbr, gmt, both], default: msigdbr}
      gene_set_collections:    {type: list, values: [H, GO:BP, GO:MF, GO:CC, REACTOME, KEGG, WIKIPATHWAYS], default: [H, GO:BP, REACTOME, KEGG]}
      gmt_files:               {type: list, default: []}
      gene_set_min_size:       {type: integer, default: 15}
      gene_set_max_size:       {type: integer, default: 500}
      enrichment_padj_cutoff:  {type: number, default: 0.05}
      min_genes_for_ora:       {type: integer, default: 5}
    outputs:
      "<collection>/ora_up.csv":   pathway, pvalue, padj, n_overlap, set_size, fold_enrichment, overlap_genes
      "<collection>/ora_down.csv": same, for down genes
      "<collection>/gsea.csv":     pathway, pvalue, padj, ES, NES, set_size, direction, leading_edge_genes
      "<collection>/*.png":        dot plots (ORA) and NES bar plot (GSEA)
      enrichment_summary.json:     methods, versions, counts and top hits per collection (or status skipped + reason)

  - id: 7
    name: 07_report
    script: scripts/07_report.R
    critical: false
    description: Methods paragraph from recorded parameters and versions, plus a self-contained HTML report.
    parameters: {}
    outputs:
      methods.md:  Methods text and references
      report.html: Full report (needs pandoc)

# The statistical methods of this code bank. Agents (and the code they write)
# may change parameters, never these methods. `not_allowed` lists common
# alternatives that would change the analysis; each says what to use instead.
methods:
  allowed:
    normalisation:           {method: "DESeq2 median-of-ratios size factors", packages: [DESeq2]}
    transformation:          {method: "DESeq2 variance-stabilising transformation (vst, blind)", packages: [DESeq2]}
    exploratory:             {method: "PCA (prcomp) on the most variable VST genes; Euclidean sample distances", packages: [stats]}
    differential_expression: {method: "DESeq2 negative binomial GLM, Wald test", packages: [DESeq2]}
    fold_change_shrinkage:   {method: "apeglm (default), ashr or normal", packages: [apeglm, ashr, DESeq2]}
    multiple_testing:        {method: "Benjamini-Hochberg adjusted p-values", packages: [stats]}
    pathway_enrichment:      {method: "fgsea pre-ranked GSEA and fgsea::fora over-representation", packages: [fgsea, msigdbr]}
    alternative_splicing:    {method: "rMATS likelihood-ratio test on PSI, BH FDR per event type; read-coverage filter (splicing module)", packages: [rMATS]}
    isoform_expression:      {method: "DESeq2 on tximport transcript counts with length offsets (isoform module, DEI)", packages: [DESeq2, tximport]}
    isoform_usage:           {method: "DEXSeq on dtuScaledTPM transcript counts with stageR two-stage FDR (isoform module, DUI)", packages: [DEXSeq, stageR, tximport]}
    alternative_splicing_suppa: {method: "SUPPA2 events from the annotation, PSI from Salmon TPM, diffSplice empirical method with gene-level correction (suppa module)", packages: [SUPPA]}
    alternative_splicing_majiq: {method: "MAJIQ v3 local splicing variations: build, psi-coverage, deltapsi posterior P(|dPSI| >= threshold); voila tsv / modulize (majiq module, academic licence)", packages: [MAJIQ, voila]}
    read_processing:         {method: "fastp trimming and QC, STAR alignment, Salmon quantification, tximport (later/)", packages: [fastp, STAR, salmon, samtools, tximport]}
    gene_sets:               {method: "MSigDB through msigdbr, or user GMT files", packages: [msigdbr]}
    cross_study_comparison:  {method: "Results-level comparison of DE results: fold-change correlation, Fisher overlap of significant genes, stratified RRHO, GSEA NES comparison; human-mouse genes through babelgene one-to-one orthologs (compare module)", packages: [babelgene, fgsea]}
  not_allowed:
    - {name: edgeR,          detect: [edgeR, DGEList, calcNormFactors, glmQLFit, glmQLFTest, exactTest, glmLRT], instead: "DESeq2 (the code bank's differential expression)"}
    - {name: limma / voom,   detect: [limma, voom, lmFit, eBayes, topTable, removeBatchEffect], instead: "DESeq2 with covariates in the design"}
    - {name: other DE tools, detect: [NOISeq, baySeq, sleuth, EBSeq, DSS, pydeseq2, DESeq2Py, diffxpy], instead: "DESeq2 (the code bank's differential expression)"}
    - {name: per-gene t / rank tests, detect: [t.test, wilcox.test, ttest_ind, ttest_rel, mannwhitneyu, wilcoxon, ranksums, kruskal], instead: "DESeq2 for gene-level tests"}
    - {name: batch correction of counts, detect: [ComBat, ComBat_seq, ComBat-seq, RUVSeq, RUVg, svaseq], instead: "add the batch column as a covariate"}
    - {name: other enrichment tools, detect: [clusterProfiler, enricher, enrichGO, enrichKEGG, gseGO, gseKEGG, ReactomePA, enrichR, enrichr, gseapy, GSVA, gsva, ssgsea, topGO, goseq, GOstats, gage, decoupler, g:Profiler, gprofiler], instead: "fgsea (GSEA and fora), as in step 06"}
    - {name: other splicing tools, detect: [leafcutter, JunctionSeq, VAST-tools, vast-tools, SplAdder, Whippet, SGSeq, LeafCutterMD], instead: "rMATS (splicing module), SUPPA2 (suppa module) or MAJIQ (majiq module)"}
    - {name: other isoform-usage tools, detect: [DRIMSeq, dmTest, IsoformSwitchAnalyzeR, isoformSwitchTestDEXSeq, BayesDRIMSeq, satuRn, fishpond, swish], instead: "DEXSeq + stageR in the isoform module (isoforms/scripts/run_isoforms.R)"}
    - {name: merging counts across studies, detect: [RunHarmony, IntegrateData, crossStudyMerge], instead: "compare the studies' results with the compare module (compare/scripts/run_compare.R); never merge raw counts from different studies"}
    - {name: other RRHO implementations, detect: [RRHO2, "RRHO::", "RRHO("], instead: "rrho_map() in the compare module (stratified RRHO, BY correction)"}
    - {name: other normalisation, detect: [TPM, RPKM, FPKM, cpm(, rpkm(, quantile normalization, normalize.quantiles], instead: "DESeq2 size factors / VST for analysis; other units only for display, labelled as such"}

# Additional modules. Each has its own entry point, defaults and run folders, and
# follows the same rules as the main pipeline (parameters only, methods fixed).
modules:
  splicing:
    description: >
      Differential alternative splicing from rMATS output tables (SE, MXE, A3SS,
      A5SS, RI): input check, significant events (FDR, dPSI, read coverage),
      figures, pathway over-representation of spliced genes, methods text.
      Starts from rMATS tables the way the main pipeline starts from counts.
    entry_point: splicing/scripts/run_splicing.R
    defaults_file: splicing/config/default_params.yaml
    tests: splicing/tests/run_splicing_tests.R
    command_examples:
      - Rscript splicing/scripts/run_splicing.R --rmats_dir <rmats_output> --group_1_name KO --group_2_name WT --run_name ko_splicing
      - Rscript splicing/scripts/run_splicing.R --based_on runs/<run_id> --set "delta_psi_cutoff=0.2"
    steps:
      - {id: 1, name: S01_validate_rmats, critical: true, description: Check the rMATS tables (columns, statistics present, replicates, group names) and standardise them}
      - {id: 2, name: S02_splicing_results, critical: true, description: "Significant events: FDR, |dPSI| and read coverage; tables and figures"}
      - {id: 3, name: S03_splicing_enrichment, critical: false, description: fgsea::fora on genes with significant events (universe = genes with tested events)}
      - {id: 4, name: S04_splicing_report, critical: false, description: Methods paragraph}
    parameters:
      run_name:             {type: string, default: splicing, description: Short label for the run folder name}
      seed:                 {type: integer, default: 42}
      rmats_dir:            {type: path, required: true, description: Folder with SE.MATS.JCEC.txt etc.}
      count_type:           {type: enum, values: [JCEC, JC], default: JCEC}
      event_types:          {type: list, values: [SE, MXE, A3SS, A5SS, RI], default: [SE, MXE, A3SS, A5SS, RI]}
      group_1_name:         {type: string, default: null, description: rMATS sample 1 (--b1), the test group}
      group_2_name:         {type: string, default: null, description: rMATS sample 2 (--b2), the reference group}
      group_1_samples:      {type: list, default: [], description: Sample names in --b1 order (plots)}
      group_2_samples:      {type: list, default: [], description: Sample names in --b2 order (plots)}
      organism:             {type: enum, values: [auto, human, mouse, other], default: auto}
      fdr_cutoff:           {type: number, default: 0.05}
      delta_psi_cutoff:     {type: number, default: 0.1}
      min_reads_per_sample: {type: number, default: 10, description: Mean inclusion + skipping reads per sample, in both groups}
      n_label_events:       {type: integer, default: 10}
      n_heatmap_events:     {type: integer, default: 40}
      plot_palette:         {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito}
      group_colours:        {type: list, default: []}
      up_colour:            {type: colour, default: "#D55E00"}
      down_colour:          {type: colour, default: "#0072B2"}
      run_enrichment:       {type: bool, default: true}
      gene_set_source:      {type: enum, values: [msigdbr, gmt, both], default: msigdbr}
      gene_set_collections: {type: list, values: [H, GO:BP, GO:MF, GO:CC, REACTOME, KEGG, WIKIPATHWAYS], default: [H, GO:BP, REACTOME, KEGG]}
      gmt_files:            {type: list, default: []}
      gene_set_min_size:    {type: integer, default: 15}
      gene_set_max_size:    {type: integer, default: 500}
      enrichment_padj_cutoff: {type: number, default: 0.05}
      min_genes_for_ora:    {type: integer, default: 5}
      rmats_version:        {type: string, default: null}
      de_run:               {type: path, default: null, description: Main-pipeline run of the same comparison (splicing vs expression)}
    outputs:
      S01_validate_rmats/validation_report.json: Every check with id, status and message
      S01_validate_rmats/events_validated.csv:   All events, standard columns (1-based coordinates)
      S02_splicing_results/splicing_events_all.csv: "Every event with passes_coverage, significant, direction (up = more inclusion in group 1)"
      S02_splicing_results/splicing_events_significant.csv: Significant events, strongest first
      S02_splicing_results/splicing_summary.json: Counts per event type and direction, top events
      S02_splicing_results/*.png: event_counts, dpsi_volcano, psi_scatter, dpsi_distribution, top_events_heatmap
      S02_splicing_results/splicing_vs_expression.csv: "With de_run: per gene, splicing only / expression only / both"
      "S03_splicing_enrichment/<collection>/ora_*.csv": Pathways among spliced genes (all events, only more / only less inclusion, per event type)
      S04_splicing_report/methods.md: Methods text
      run_summary.json: Headline results and warnings
    answers:
      "which events / genes are differentially spliced": [S02_splicing_results/splicing_events_significant.csv, S02_splicing_results/splicing_summary.json]
      "is gene X differentially spliced": [S02_splicing_results/splicing_events_all.csv]
      "pathways among spliced genes": [S03_splicing_enrichment/enrichment_summary.json]
    # How the website offers this module (read by the copilot; changing it changes the site, no site code needed).
    # See docs/ADDING_A_MODULE.md for every field.
    site:
      attach_to: run                 # offered on every finished main-pipeline run ("Splicing & isoforms" tab)
      title: Alternative splicing (rMATS)
      description: >
        Which exons are included more or less often in {test} than in {reference}: skipped exons, retained
        introns, alternative 5'/3' splice sites and mutually exclusive exons, from rMATS. Results are compared
        with this run's gene-level results, so you can see which genes change splicing, expression, or both.
      inputs:
        - name: rmats_tables
          handler: files             # how the site stores and checks the upload (see docs/ADDING_A_MODULE.md)
          sets: rmats_dir            # the module parameter that gets the folder holding the files
          keep: '^(SE|MXE|A3SS|A5SS|RI)\.MATS\.(JC|JCEC)\.txt$'     # files to keep (also from inside a .zip)
          require: '\.MATS\.{count_type}\.txt$'                     # at least one kept file must match ({form values})
          none_found: "No rMATS tables found. Upload the files named like SE.MATS.JCEC.txt (or a .zip of rMATS's output folder)."
          not_required_found: "No {count_type} tables among the uploaded files ({found})."
          label: rMATS output tables
          accept: [".txt", ".zip"]
          multiple: true
          required: true
          help: >
            The files rMATS wrote (SE.MATS.JCEC.txt, MXE..., A3SS..., A5SS..., RI...), or a .zip of its output
            folder. rMATS needs BAM files; the code bank's later/scripts/U04_rmats.R runs it.
      from_run:                      # module parameter: value taken from the finished run
        organism: run.organism
        de_run: run.dir
        run_name: "{test}_vs_{reference}_splicing"
      inherit: [gene_set_collections, run_enrichment, plot_palette, up_colour, down_colour, group_colours]
      form:
        - {name: group_1_name, type: run_group, pair: group_2_name, default: test, label: "rMATS sample 1 (--b1) was",
           help: "Sets the direction: dPSI = PSI(sample 1) - PSI(sample 2).",
           notes: {reference: "rMATS sample 1 (--b1) was {reference}: dPSI = PSI({reference}) - PSI({test}); positive = more inclusion in {reference}."}}
        - {name: count_type, type: enum, label: Reads used,
           labels: {JCEC: "Junction + exon-body reads (JCEC, recommended)", JC: "Junction reads only (JC)"}}
        - {name: fdr_cutoff, type: number, label: FDR cutoff, min: 0.0001, max: 1}
        - {name: delta_psi_cutoff, type: number, label: "Minimum |dPSI|", min: 0, max: 0.9, help: "0.1 = 10 percentage points of inclusion."}
        - {name: min_reads_per_sample, type: number, label: Minimum reads per sample, min: 0}
      results:
        sources: {s: S02_splicing_results/splicing_summary.json}
        tiles:
          - {label: events tested, value: s.n_events_tested}
          - {label: significant, value: s.n_significant}
          - {label: more inclusion, value: s.n_up, style: up}
          - {label: less inclusion, value: s.n_down, style: down}
          - {label: genes, value: s.n_genes_significant}
        headline:
          - "{s.n_significant} of {s.n_events_tested} splicing events were significant ({s.significance_rule}): {s.n_up} with more and {s.n_down} with less inclusion, in {s.n_genes_significant} genes. {s.sign_convention}."
          - {text: "Compared with this run's gene-level results: {s.splicing_vs_expression.genes}.", when: s.splicing_vs_expression.genes}
        figures:
          - {path: S02_splicing_results/event_counts.png, title: Significant events by type, caption: "Events per type that pass the significance rule, split by direction."}
          - {path: S02_splicing_results/dpsi_volcano.png, title: Change in inclusion, caption: "Each dot is an event: change in percent spliced in (x) against the evidence (y)."}
          - {path: S02_splicing_results/dpsi_distribution.png, title: dPSI by event type, caption: "Violins: all events with enough reads; points: significant events."}
          - {path: S02_splicing_results/splicing_vs_expression.png, title: Splicing vs expression, caption: "Genes whose splicing changes, whose expression changes (this run), or both."}
          - {path: S02_splicing_results/psi_scatter.png, title: PSI in each group, caption: "Mean inclusion per event in the two groups."}
          - {path: S02_splicing_results/top_events_heatmap.png, title: Top events per sample, caption: "Inclusion (PSI) of the strongest significant events in every sample."}
        top_tables:
          - title: Top significant events
            path: S02_splicing_results/splicing_events_significant.csv
            rows: 50
            empty: No significant events.
            columns:
              - {label: Gene, value: gene_symbol, fallback: gene_id}
              - {label: Type, value: event_type}
              - {label: Location, template: "{chr}:{event_start}-{event_end} ({strand})", style: small}
              - {label: PSI 1, value: psi_1, format: num2}
              - {label: PSI 2, value: psi_2, format: num2}
              - {label: dPSI, value: delta_psi, format: num2, style: sign}
              - {label: FDR, value: fdr, format: p}
        tables: [S02_splicing_results/splicing_events_all.csv, S02_splicing_results/splicing_events_significant.csv, S02_splicing_results/splicing_vs_expression.csv]
        methods: S04_splicing_report/methods.md
        chat_files: [S02_splicing_results/splicing_summary.json, S02_splicing_results/splicing_events_all.csv,
                     S02_splicing_results/splicing_events_significant.csv, S02_splicing_results/splicing_vs_expression.csv,
                     S03_splicing_enrichment/enrichment_summary.json, S04_splicing_report/methods.md]
      rerun:                         # for the code .zip: parameters that point at input data, and the folder name they get
        data: {rmats_dir: rmats}
        drop: [de_run]
        pass_de_run: true            # run_splicing.sh takes the main run folder as its first argument

  isoforms:
    description: >
      Differential isoform expression (DEI: DESeq2 per transcript) and differential
      isoform usage (DUI: DEXSeq on transcript shares within genes, stageR
      two-stage FDR) from Salmon or kallisto transcript quantification.
    entry_point: isoforms/scripts/run_isoforms.R
    defaults_file: isoforms/config/default_params.yaml
    tests: isoforms/tests/run_isoform_tests.R
    command_examples:
      - Rscript isoforms/scripts/run_isoforms.R --quant_dir <salmon> --metadata_file samples.csv --gtf_file genes.gtf --condition genotype --reference_level WT --test_level KO
      - Rscript isoforms/scripts/run_isoforms.R --based_on runs/<run_id> --set "min_delta_usage=0.2"
    steps:
      - {id: 1, name: I01_validate_isoforms, critical: true, description: Check sample table, quantification files, transcript-to-gene mapping and design; import with tximport}
      - {id: 2, name: I02_differential_isoform_expression, critical: true, description: "DEI: DESeq2 per transcript (same filter, design, test and shrinkage as step 04)"}
      - {id: 3, name: I03_differential_isoform_usage, critical: false, description: "DUI: DEXSeq on transcript shares within genes, stageR gene-then-transcript FDR"}
      - {id: 4, name: I04_isoform_report, critical: false, description: Methods paragraph}
    parameters:
      run_name:             {type: string, default: isoforms, description: Short label for the run folder name}
      seed:                 {type: integer, default: 42}
      organism:             {type: enum, values: [auto, human, mouse, other], default: auto, description: Recorded; used for gene names only}
      n_label:              {type: integer, default: 12, description: Transcripts labelled on the volcano plots}
      group_colours:        {type: list, default: [], description: "e.g. [\"KO=#D55E00\", \"WT=#0072B2\"]"}
      quant_dir:          {type: path, required: true, description: "<sample>/quant.sf (Salmon) or <sample>/abundance.tsv (kallisto)"}
      quant_type:         {type: enum, values: [salmon, kallisto], default: salmon}
      metadata_file:      {type: path, required: true}
      gtf_file:           {type: path, default: null}
      tx2gene_file:       {type: path, default: null}
      ignore_tx_version:  {type: bool, default: false}
      condition:          {type: column, default: condition}
      reference_level:    {type: string, default: null}
      test_level:         {type: string, default: null}
      covariates:         {type: list, default: []}
      exclude_samples:    {type: list, default: []}
      min_count:          {type: integer, default: 10}
      min_samples:        {type: integer, default: null}
      lfc_shrinkage:      {type: enum, values: [apeglm, ashr, normal, none], default: apeglm}
      padj_cutoff:        {type: number, default: 0.05}
      log2fc_cutoff:      {type: number, default: 1}
      min_feature_count:  {type: number, default: 10}
      min_feature_prop:   {type: number, default: 0.1}
      min_gene_count:     {type: number, default: 10}
      dui_alpha:          {type: number, default: 0.05}
      min_delta_usage:    {type: number, default: 0.1}
      threads:            {type: integer, default: 1}
      n_usage_plots:      {type: integer, default: 12}
      plot_palette:       {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito}
      up_colour:          {type: colour, default: "#D55E00"}
      down_colour:        {type: colour, default: "#0072B2"}
    outputs:
      I02_differential_isoform_expression/dei_results_all.csv: "Per transcript: gene, log2FoldChange (shrunken), padj, mean TPM per group, significant, direction"
      I02_differential_isoform_expression/dei_volcano.png: Volcano plot of transcripts
      I03_differential_isoform_usage/dui_transcripts_all.csv: "Per transcript: share of its gene in each group, delta_usage, gene_padj, transcript_padj, significant"
      I03_differential_isoform_usage/dui_genes.csv: "Per gene: gene_padj, transcripts gaining / losing share, isoform_switch"
      I03_differential_isoform_usage/dui_top_genes_usage.png: Transcript shares for the top genes
      I04_isoform_report/methods.md: Methods text
    answers:
      "is a transcript of gene X up or down": [I02_differential_isoform_expression/dei_results_all.csv]
      "does gene X switch isoforms": [I03_differential_isoform_usage/dui_genes.csv, I03_differential_isoform_usage/dui_transcripts_all.csv]
    site:
      attach_to: run
      title: Transcript isoforms (DEI and DUI)
      description: >
        **Isoform expression (DEI):** which transcripts are more or less abundant (DESeq2 per transcript, with
        this run's settings). **Isoform usage (DUI):** which genes change the share each transcript makes up (an
        isoform switch), even when the gene's total does not change (DEXSeq + stageR). Uses this run's sample
        table, groups and covariates ({condition}: {test} vs {reference}).
      inputs:
        - name: quant_zip
          handler: sample_folders    # a .zip with one folder per sample of the run, each holding `file`
          sets: quant_dir
          file: quant.sf
          label: Salmon output (.zip)
          accept: [".zip"]
          required: true
          help: >
            One folder per sample containing quant.sf, folders named exactly like this run's samples. The code
            bank's later/scripts/U02_salmon_quant.R makes them.
        - name: annotation
          handler: annotation
          sets: [gtf_file, tx2gene_file]
          label: Annotation (optional)
          accept: [".gtf", ".gz", ".csv", ".tsv", ".txt"]
          required: false
          help: >
            The GTF the Salmon index was built from (.gtf or .gtf.gz), or a table with transcript_id and gene_id.
            Not needed when the transcript names include the gene (GENCODE transcript FASTA).
      from_run:
        metadata_file: run.metadata_file
        condition: run.condition
        reference_level: run.reference_level
        test_level: run.test_level
        covariates: run.covariates
        organism: run.organism
        run_name: "{test}_vs_{reference}_isoforms"
      fixed: {quant_type: salmon, threads: 2}
      inherit: [padj_cutoff, log2fc_cutoff, lfc_shrinkage, min_count, plot_palette, up_colour, down_colour]
      form:
        - {name: min_delta_usage, type: number, label: Minimum change in usage, min: 0, max: 0.9,
           help: "0.1 = the transcript's share of its gene changes by 10 percentage points."}
        - {name: dui_alpha, type: number, label: FDR for isoform usage, min: 0.0001, max: 1}
      results:
        sources: {dei: I02_differential_isoform_expression/dei_summary.json, dui: I03_differential_isoform_usage/dui_summary.json}
        tiles:
          - {label: transcripts change (DEI), value: dei.n_significant}
          - {label: genes (DEI), value: dei.n_genes_with_significant_transcripts}
          - {label: genes change usage (DUI), value: dui.n_genes_significant}
          - {label: isoform switches, value: dui.n_isoform_switches}
        headline:
          - "**Isoform expression (DEI):** {dei.n_significant} transcripts ({dei.n_up} higher, {dei.n_down} lower) in {dei.n_genes_with_significant_transcripts} genes; {dei.significance_rule}."
          - {text: "**Isoform usage (DUI):** {dui.n_genes_significant} of {dui.n_genes_tested} genes change how their transcripts are used ({dui.n_isoform_switches} isoform switches); {dui.significance_rule}.", unless: dui.status}
          - {text: "Isoform usage was not tested: {dui.reason}", when: dui.status}
        figures:
          - {path: I03_differential_isoform_usage/dui_top_genes_usage.png, title: "Isoform usage, top genes", caption: "Share of each gene made up by each transcript; bars are group means, points samples."}
          - {path: I03_differential_isoform_usage/dui_volcano.png, title: Differential isoform usage, caption: "Change in a transcript's share of its gene against the evidence."}
          - {path: I02_differential_isoform_expression/dei_volcano.png, title: Differential isoform expression, caption: "Each dot is a transcript: fold change against the evidence."}
          - {path: I02_differential_isoform_expression/dei_ma_plot.png, title: "MA plot, transcripts", caption: "Fold change against mean expression."}
        top_tables:
          - title: Genes that change isoform usage
            path: I03_differential_isoform_usage/dui_genes.csv
            filter: {significant: "TRUE"}
            rows: 50
            empty: None.
            columns:
              - {label: Gene, value: gene_name, fallback: gene_id}
              - {label: adj. p (gene), value: gene_padj, format: p}
              - {label: "max |delta usage|", value: max_abs_delta_usage, format: num2}
              - {label: Switch, value: isoform_switch, format: flag}
              - {label: Gaining share, value: transcripts_up, style: small}
              - {label: Losing share, value: transcripts_down, style: small}
          - title: Top transcripts by isoform expression
            path: I02_differential_isoform_expression/dei_results_significant.csv
            rows: 50
            empty: None.
            columns:
              - {label: Transcript, value: transcript_id, style: small}
              - {label: Gene, value: gene_name, fallback: gene_id}
              - {label: log2 FC, value: log2FoldChange, format: num2, style: sign}
              - {label: adj. p, value: padj, format: p}
        tables: [I02_differential_isoform_expression/dei_results_all.csv, I03_differential_isoform_usage/dui_transcripts_all.csv, I03_differential_isoform_usage/dui_genes.csv]
        methods: I04_isoform_report/methods.md
        chat_files: [I02_differential_isoform_expression/dei_summary.json, I02_differential_isoform_expression/dei_results_all.csv,
                     I03_differential_isoform_usage/dui_summary.json, I03_differential_isoform_usage/dui_genes.csv,
                     I03_differential_isoform_usage/dui_transcripts_all.csv, I04_isoform_report/methods.md]
      rerun:
        data: {quant_dir: quant, metadata_file: null, gtf_file: null, tx2gene_file: null}

  suppa:
    description: >
      Differential alternative splicing with SUPPA2 from Salmon transcript quantification:
      events from the annotation (skipped exons, alternative 5'/3' sites, mutually exclusive
      exons, retained introns, alternative first/last exons), PSI per event from transcript
      TPM, diffSplice (empirical method) between two groups, tables and figures; optionally
      the agreement with rMATS on the same samples, events matched by their splice junctions.
    entry_point: suppa/scripts/run_suppa.R
    defaults_file: suppa/config/default_params.yaml
    tests: suppa/tests/run_suppa_tests.R
    install: suppa/install/install_suppa.sh
    command_examples:
      - Rscript suppa/scripts/run_suppa.R --quant_dir <salmon> --metadata_file samples.csv --gtf_file genes.gtf --condition genotype --reference_level WT --test_level KO
      - Rscript suppa/scripts/run_suppa.R --quant_dir <salmon> --metadata_file samples.csv --gtf_file genes.gtf --condition genotype --reference_level WT --test_level KO --rmats_dir <rmats_output>
      - Rscript suppa/scripts/run_suppa.R --based_on runs/<run_id> --set "dpsi_cutoff=0.2"
    steps:
      - {id: 1, name: SU01_validate_suppa, critical: true, description: "Check SUPPA2, the sample table and groups, quant.sf per sample, transcripts against the GTF; TPM table per group"}
      - {id: 2, name: SU02_suppa_events_psi, critical: true, description: "generateEvents from the GTF (strict); psiPerEvent per group"}
      - {id: 3, name: SU03_suppa_diffsplice, critical: true, description: "diffSplice, empirical method (gene correction; paired optional); significant events, genes, figures"}
      - {id: 4, name: SU04_suppa_vs_rmats, critical: false, description: "Optional: match events with rMATS by splice junctions; agreement of dPSI and of significant events"}
      - {id: 5, name: SU05_suppa_report, critical: false, description: Methods paragraph}
    parameters:
      run_name:             {type: string, default: suppa, description: Short label for the run folder name}
      seed:                 {type: integer, default: 42}
      organism:             {type: enum, values: [auto, human, mouse, other], default: auto, description: Recorded only}
      quant_dir:            {type: path, required: true, description: "<sample>/quant.sf (Salmon)"}
      metadata_file:        {type: path, required: true}
      gtf_file:             {type: path, required: true, description: The GTF the Salmon index was built from (.gtf or .gtf.gz)}
      condition:            {type: column, default: condition}
      reference_level:      {type: string, default: null, description: "Control group, first in SUPPA (dPSI = test - reference)"}
      test_level:           {type: string, default: null}
      exclude_samples:      {type: list, default: []}
      event_types:          {type: list, values: [SE, SS, MX, RI, FL], default: [SE, SS, MX, RI, FL]}
      gene_correction:      {type: bool, default: true, description: "diffSplice -gc: p-values corrected for the number of events per gene"}
      paired:               {type: bool, default: false, description: "diffSplice -pa: replicate i of each group are paired (sample-table order)"}
      area:                 {type: integer, default: 1000, description: "diffSplice -a: events per TPM bin for the empirical distribution"}
      lower_bound:          {type: number, default: 0, description: "diffSplice -l"}
      tpm_threshold:        {type: number, default: 0, description: "diffSplice -th: minimum mean TPM of the event's transcripts"}
      pvalue_cutoff:        {type: number, default: 0.05}
      dpsi_cutoff:          {type: number, default: 0.1}
      rmats_dir:            {type: path, default: null, description: Optional rMATS output of the same comparison (SU04)}
      rmats_count_type:     {type: enum, values: [JCEC, JC], default: JCEC}
      rmats_fdr_cutoff:     {type: number, default: 0.05}
      rmats_b1_is_test:     {type: bool, default: true, description: "rMATS --b1 was the test group; false flips rMATS's dPSI"}
      n_label_events:       {type: integer, default: 10}
      plot_palette:         {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito}
      up_colour:            {type: colour, default: "#D55E00"}
      down_colour:          {type: colour, default: "#0072B2"}
      suppa_command:        {type: string, default: null, description: "How to run SUPPA2; found automatically (suppa/install/install_suppa.sh)"}
    outputs:
      SU01_validate_suppa/validation_report.json: Every check with id, status and message
      "SU01_validate_suppa/<group>.tpm": Transcript TPM per group in SUPPA's format (the input SUPPA used)
      SU02_suppa_events_psi/events_all.ioe: All events found in the annotation
      "SU02_suppa_events_psi/<group>.psi": PSI per event and sample
      SU03_suppa_diffsplice/suppa_events_all.csv: "Every event: gene, type, location, mean PSI per group, dpsi (test - reference), pvalue, significant, direction"
      SU03_suppa_diffsplice/suppa_events_significant.csv: Significant events, strongest first
      SU03_suppa_diffsplice/suppa_genes_significant.csv: Genes with significant events (types, counts by direction)
      SU03_suppa_diffsplice/suppa_summary.json: Counts per event type and direction, rule, sign convention, top events
      SU03_suppa_diffsplice/*.png: event_counts, dpsi_volcano, psi_scatter
      SU04_suppa_vs_rmats/comparison_summary.json: "Agreement with rMATS: matched events, Spearman of dPSI, significant in both (per type in comparison_by_type.csv)"
      SU04_suppa_vs_rmats/significant_in_both.csv: Events significant in both tools
      SU05_suppa_report/methods.md: Methods text
    answers:
      "which events / genes are differentially spliced (SUPPA2)": [SU03_suppa_diffsplice/suppa_events_significant.csv, SU03_suppa_diffsplice/suppa_summary.json]
      "is gene X differentially spliced (SUPPA2)": [SU03_suppa_diffsplice/suppa_events_all.csv]
      "do SUPPA2 and rMATS agree": [SU04_suppa_vs_rmats/comparison_summary.json, SU04_suppa_vs_rmats/significant_in_both.csv]
    site:
      attach_to: run
      title: Alternative splicing (SUPPA2)
      description: >
        Which splicing events change between {test} and {reference}, from transcript abundance (Salmon): skipped
        exons, alternative 5'/3' splice sites, mutually exclusive exons, retained introns and alternative first or
        last exons, tested with SUPPA2's empirical method. With rMATS tables of the same samples, also shows how
        well the two tools agree.
      inputs:
        - name: quant_zip
          handler: sample_folders
          sets: quant_dir
          file: quant.sf
          label: Salmon output (.zip)
          accept: [".zip"]
          required: true
          help: >
            One folder per sample containing quant.sf, folders named exactly like this run's samples. The code
            bank's later/scripts/U02_salmon_quant.R makes them.
        - name: gtf
          handler: file
          sets: gtf_file
          label: Annotation (GTF)
          accept: [".gtf", ".gz"]
          required: true
          help: The GTF the Salmon index was built from (.gtf or .gtf.gz). SUPPA2 finds the events in it.
        - name: rmats_tables
          handler: files
          sets: rmats_dir
          keep: '^(SE|MXE|A3SS|A5SS|RI)\.MATS\.(JC|JCEC)\.txt$'
          none_found: "No rMATS tables found among the files (named like SE.MATS.JCEC.txt)."
          label: rMATS output tables (optional)
          accept: [".txt", ".zip"]
          multiple: true
          required: false
          help: To compare SUPPA2 with rMATS on the same samples (rMATS --b1 = the test group).
      from_run:
        metadata_file: run.metadata_file
        condition: run.condition
        reference_level: run.reference_level
        test_level: run.test_level
        organism: run.organism
        run_name: "{test}_vs_{reference}_suppa"
      inherit: [plot_palette, up_colour, down_colour]
      form:
        - {name: dpsi_cutoff, type: number, label: "Minimum |dPSI|", min: 0, max: 0.9, help: "0.1 = 10 percentage points of inclusion."}
        - {name: pvalue_cutoff, type: number, label: p-value cutoff, min: 0.0001, max: 1}
        - {name: gene_correction, type: bool, label: Correct p-values for the number of events per gene}
        - {name: paired, type: bool, label: Paired samples, help: "Only when replicate 1 of each group belongs together (same batch or donor), and so on, in the sample-table order."}
      results:
        sources: {s: SU03_suppa_diffsplice/suppa_summary.json, c: SU04_suppa_vs_rmats/comparison_summary.json}
        tiles:
          - {label: events tested, value: s.n_events_tested}
          - {label: significant, value: s.n_significant}
          - {label: more inclusion, value: s.n_up, style: up}
          - {label: less inclusion, value: s.n_down, style: down}
          - {label: genes, value: s.n_genes_significant}
        headline:
          - "{s.n_significant} of {s.n_events_tested} events were significant ({s.significance_rule}): {s.n_up} with more and {s.n_down} with less inclusion, in {s.n_genes_significant} genes ({s.by_type_text}). {s.sign_convention}."
          - {text: "Compared with rMATS on the same samples: {c.n_matched} events tested by both, dPSI agreement Spearman {c.spearman_dpsi_matched}, {c.n_sig_both} significant in both ({c.rule}).", when: c.n_matched}
        figures:
          - {path: SU03_suppa_diffsplice/event_counts.png, title: Significant events by type, caption: "Events per type that pass the significance rule, split by direction."}
          - {path: SU03_suppa_diffsplice/dpsi_volcano.png, title: Change in inclusion, caption: "Each dot is an event: change in percent spliced in (x) against the evidence (y)."}
          - {path: SU03_suppa_diffsplice/psi_scatter.png, title: PSI in each group, caption: "Mean inclusion per event in the two groups."}
          - {path: SU04_suppa_vs_rmats/suppa_vs_rmats_dpsi.png, title: SUPPA2 vs rMATS, caption: "Events found by both tools: change in inclusion from each, coloured by which tool calls them significant."}
        top_tables:
          - title: Top significant events
            path: SU03_suppa_diffsplice/suppa_events_significant.csv
            rows: 50
            empty: No significant events.
            columns:
              - {label: Gene, value: gene_name, fallback: gene_id}
              - {label: Type, value: event_type}
              - {label: Location, template: "{chr}:{event_start}-{event_end} ({strand})", style: small}
              - {label: "PSI ref.", value: psi_reference, format: num2}
              - {label: PSI test, value: psi_test, format: num2}
              - {label: dPSI, value: dpsi, format: num2, style: sign}
              - {label: p, value: pvalue, format: p}
        tables: [SU03_suppa_diffsplice/suppa_events_all.csv, SU03_suppa_diffsplice/suppa_events_significant.csv,
                 SU03_suppa_diffsplice/suppa_genes_significant.csv, SU04_suppa_vs_rmats/significant_in_both.csv, SU04_suppa_vs_rmats/comparison_by_type.csv]
        methods: SU05_suppa_report/methods.md
        chat_files: [SU03_suppa_diffsplice/suppa_summary.json, SU03_suppa_diffsplice/suppa_events_significant.csv,
                     SU03_suppa_diffsplice/suppa_genes_significant.csv, SU04_suppa_vs_rmats/comparison_summary.json, SU05_suppa_report/methods.md]
      rerun:
        data: {quant_dir: quant, gtf_file: annotation, rmats_dir: rmats, metadata_file: null}

  majiq:
    description: >
      Differential splicing with MAJIQ v3 from aligned reads: splice graph from the GFF3
      annotation and the BAMs, local splicing variations (LSVs) quantified per group, the
      posterior probability that a junction's PSI changes by at least a threshold
      (deltapsi), voila tables and modulize event types. MAJIQ has an academic licence
      and is installed per server (majiq/install/install_majiq.sh).
    entry_point: majiq/scripts/run_majiq.R
    defaults_file: majiq/config/default_params.yaml
    tests: majiq/tests/run_majiq_tests.R
    install: majiq/install/install_majiq.sh
    licence: "MAJIQ academic licence: non-commercial use at academic / not-for-profit institutions; not redistributed in the site image"
    command_examples:
      - Rscript majiq/scripts/run_majiq.R --bam_dir <star_output> --metadata_file samples.csv --gff3_file genes.gff3.gz --condition genotype --reference_level WT --test_level KO
      - Rscript majiq/scripts/run_majiq.R --based_on runs/<run_id> --set "probability_threshold=0.9"
    steps:
      - {id: 1, name: MJ01_validate_majiq, critical: true, description: "Check MAJIQ, voila and the licence, the sample table and groups, the GFF3, sorted indexed BAMs; experiments.tsv"}
      - {id: 2, name: MJ02_majiq_build, critical: true, description: "majiq build: splice graph from the GFF3 and the BAMs"}
      - {id: 3, name: MJ03_majiq_quantify, critical: true, description: "majiq psi-coverage per group; majiq-v3 sg-coverage (for modulize)"}
      - {id: 4, name: MJ04_majiq_deltapsi, critical: true, description: "majiq deltapsi (reference = -psi1); voila tsv (all, changing); voila modulize"}
      - {id: 5, name: MJ05_majiq_results, critical: false, description: "Changing LSVs and genes, modulize event types, summary, figures"}
      - {id: 6, name: MJ06_majiq_report, critical: false, description: Methods paragraph}
    parameters:
      run_name:             {type: string, default: majiq}
      seed:                 {type: integer, default: 42}
      organism:             {type: enum, values: [auto, human, mouse, other], default: auto, description: Recorded only}
      bam_dir:              {type: path, required: true, description: "<sample>.bam, <sample>.sorted.bam or <sample>/Aligned.sortedByCoord.out.bam (sorted, indexed)"}
      metadata_file:        {type: path, required: true}
      gff3_file:            {type: path, required: true, description: GFF3 of the same annotation release as the alignment's GTF}
      condition:            {type: column, default: condition}
      reference_level:      {type: string, default: null, description: "Control group (-psi1: dPSI = test - reference)"}
      test_level:           {type: string, default: null}
      exclude_samples:      {type: list, default: []}
      strandness:           {type: enum, values: [AUTO, FORWARD, REVERSE, NONE], default: AUTO}
      dpsi_threshold:       {type: number, default: 0.2, description: "|dPSI| for changing (deltapsi --changing-threshold)"}
      probability_threshold: {type: number, default: 0.95, description: "Changing: P(|dPSI| >= dpsi_threshold) >= this on a junction"}
      run_modulize:         {type: bool, default: true}
      decomplexify_psi_threshold: {type: number, default: 0.05}
      threads:              {type: integer, default: 8}
      n_label_events:       {type: integer, default: 10}
      plot_palette:         {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito}
      up_colour:            {type: colour, default: "#D55E00"}
      down_colour:          {type: colour, default: "#0072B2"}
      majiq_bin_dir:        {type: path, default: null, description: "Folder with majiq, majiq-v3, voila; found automatically"}
      majiq_license_file:   {type: path, default: null, description: MAJIQ licence file; found automatically}
    outputs:
      MJ01_validate_majiq/validation_report.json: Every check with id, status and message
      MJ04_majiq_deltapsi/voila_all.tsv: "voila's table of every LSV (E[dPSI], P(|dPSI| >= threshold), PSI per group, junctions)"
      MJ04_majiq_deltapsi/voila_changing.tsv: voila's table of the changing LSVs
      MJ04_majiq_deltapsi/modulize/: voila modulize event tables (cassette.tsv, alt3prime.tsv, ...)
      MJ05_majiq_results/majiq_lsvs_all.csv: "Per LSV: gene, type, junction with the highest probability, dpsi (test - reference), probability_changing, PSI per group, changing, direction"
      MJ05_majiq_results/majiq_lsvs_changing.csv: Changing LSVs, most certain first
      MJ05_majiq_results/majiq_genes_changing.csv: Genes with changing LSVs
      MJ05_majiq_results/modulize_event_types.csv: Modules per event type
      MJ05_majiq_results/majiq_summary.json: Counts, rule, sign convention, modulize event types, top LSVs
      MJ05_majiq_results/*.png: lsv_volcano, event_types
      MJ06_majiq_report/methods.md: Methods text
    answers:
      "which genes / LSVs change splicing (MAJIQ)": [MJ05_majiq_results/majiq_lsvs_changing.csv, MJ05_majiq_results/majiq_summary.json]
      "is gene X differentially spliced (MAJIQ)": [MJ05_majiq_results/majiq_lsvs_all.csv]
      "which kinds of splicing events change (MAJIQ)": [MJ05_majiq_results/modulize_event_types.csv]
    site:
      attach_to: run
      title: Alternative splicing (MAJIQ)
      description: >
        Local splicing variations that change between {test} and {reference}, from the aligned reads: MAJIQ gives
        each junction the probability that its inclusion changes by at least a set amount, and voila sorts the
        changes into event types (cassette exons, alternative 5'/3' sites, intron retention, ...). Needs the BAM
        files and MAJIQ installed on the server under its academic licence.
      inputs:
        - name: bams
          handler: files
          sets: bam_dir
          keep: '\.(bam|bai)$'
          require: '\.bam$'
          none_found: "No BAM files found. Give the sorted BAMs named <sample>.bam (with their .bam.bai index)."
          label: BAM files (sorted, indexed)
          accept: [".bam", ".bai", ".zip"]
          multiple: true
          required: true
          help: >
            One <sample>.bam (and <sample>.bam.bai) per sample of this run. The code bank's later/scripts/U06_star_align.R
            makes them; on the server, the "Start from FASTQ" results already have them.
        - name: gff3
          handler: file
          sets: gff3_file
          label: Annotation (GFF3)
          accept: [".gff3", ".gff", ".gz"]
          required: true
          help: The GFF3 of the same annotation release as the GTF used for alignment (e.g. gencode.v44.primary_assembly.annotation.gff3.gz).
      from_run:
        metadata_file: run.metadata_file
        condition: run.condition
        reference_level: run.reference_level
        test_level: run.test_level
        organism: run.organism
        run_name: "{test}_vs_{reference}_majiq"
      fixed: {threads: 8}
      inherit: [plot_palette, up_colour, down_colour]
      form:
        - {name: dpsi_threshold, type: number, label: "Minimum |dPSI|", min: 0.05, max: 0.9, help: "0.2 = 20 percentage points of inclusion."}
        - {name: probability_threshold, type: number, label: Minimum probability, min: 0.5, max: 0.999, help: "An LSV changes when P(|dPSI| >= the minimum) is at least this."}
        - {name: strandness, type: enum, labels: {AUTO: "Detect from the reads", FORWARD: Forward, REVERSE: "Reverse (dUTP / TruSeq stranded)", NONE: Unstranded}}
        - {name: run_modulize, type: bool, label: Classify into event types (voila modulize)}
      results:
        sources: {s: MJ05_majiq_results/majiq_summary.json}
        tiles:
          - {label: LSVs quantified, value: s.n_lsvs_quantified}
          - {label: changing, value: s.n_lsvs_changing}
          - {label: more inclusion, value: s.n_up, style: up}
          - {label: less inclusion, value: s.n_down, style: down}
          - {label: genes, value: s.n_genes_changing}
        headline:
          - "{s.n_lsvs_changing} of {s.n_lsvs_quantified} local splicing variations change ({s.significance_rule}), in {s.n_genes_changing} genes: {s.n_up} with more and {s.n_down} with less inclusion of their most changed junction. {s.sign_convention}."
          - {text: "Event types (voila modulize): {s.modulize_text}.", when: s.modulize_text}
        figures:
          - {path: MJ05_majiq_results/lsv_volcano.png, title: Local splicing variations, caption: "Each dot is an LSV: expected change in inclusion of its most certain junction against the probability that it changes."}
          - {path: MJ05_majiq_results/event_types.png, title: Event types, caption: "Splicing modules per event type (voila modulize)."}
        top_tables:
          - title: Changing LSVs
            path: MJ05_majiq_results/majiq_lsvs_changing.csv
            rows: 50
            empty: No changing LSVs.
            columns:
              - {label: Gene, value: gene_name, fallback: gene_id}
              - {label: LSV, value: lsv_id, style: small}
              - {label: Junction, value: junction, style: small}
              - {label: "PSI ref.", value: psi_reference, format: num2}
              - {label: PSI test, value: psi_test, format: num2}
              - {label: dPSI, value: dpsi, format: num2, style: sign}
              - {label: P(change), value: probability_changing, format: num2}
        tables: [MJ05_majiq_results/majiq_lsvs_all.csv, MJ05_majiq_results/majiq_lsvs_changing.csv, MJ05_majiq_results/majiq_genes_changing.csv,
                 MJ05_majiq_results/modulize_event_types.csv, MJ04_majiq_deltapsi/voila_all.tsv]
        methods: MJ06_majiq_report/methods.md
        chat_files: [MJ05_majiq_results/majiq_summary.json, MJ05_majiq_results/majiq_lsvs_changing.csv, MJ05_majiq_results/majiq_genes_changing.csv,
                     MJ05_majiq_results/modulize_event_types.csv, MJ06_majiq_report/methods.md]
      rerun:
        data: {bam_dir: bams, gff3_file: annotation, metadata_file: null}
        drop: [majiq_bin_dir, majiq_license_file]

  compare:
    description: >
      Cross-study comparison at the level of results (never merged counts): 2 to 8
      studies, each a main-pipeline run or a published DE table. Genes matched by ID,
      Entrez, symbol or human-mouse orthologs; one significance rule for all; fold-change
      correlation, overlap of significant genes by direction (Fisher), stratified RRHO,
      and pathway (GSEA NES) comparison.
    entry_point: compare/scripts/run_compare.R
    defaults_file: compare/config/default_params.yaml
    tests: compare/tests/run_compare_tests.R
    command_examples:
      - Rscript compare/scripts/run_compare.R --studies "ours=runs/<run1>,GSE60450=runs/<run2>"
      - Rscript compare/scripts/run_compare.R --config comparison.yaml
      - Rscript compare/scripts/run_compare.R --based_on runs/<compare_run> --set "padj_cutoff=0.1"
    steps:
      - {id: 1, name: C01_harmonise_studies, critical: true, description: "Read each study, flip if asked, one significance rule, match genes (ID / Entrez / symbol / orthologs), choose the ranking metric"}
      - {id: 2, name: C02_compare_genes, critical: true, description: "Per pair: log2FC correlation, overlap of significant genes by direction with Fisher tests; across studies: correlation heatmap, recurrent genes, intersections"}
      - {id: 3, name: C03_rrho, critical: false, description: "Per pair: stratified rank-rank hypergeometric overlap map (BY-adjusted) and the genes at the strongest cells"}
      - {id: 4, name: C04_compare_pathways, critical: false, description: "GSEA NES per collection across studies (runs' own step 06; fgsea here for tables); NES correlation and shared pathways per pair"}
      - {id: 5, name: C05_compare_report, critical: false, description: Methods paragraph}
    parameters:
      run_name:             {type: string, default: compare, description: Short label for the run folder name}
      seed:                 {type: integer, default: 42}
      studies:              {type: list, required: true, description: "2-8 entries: {label, run_dir} or {label, de_file, organism, comparison}; flip: true reverses a study's fold changes"}
      match_genes_by:       {type: enum, values: [auto, gene_id, entrez, symbol, ortholog], default: auto}
      min_ortholog_support: {type: integer, default: 3}
      padj_cutoff:          {type: number, default: 0.05}
      log2fc_cutoff:        {type: number, default: 1}
      use_study_cutoffs:    {type: bool, default: false}
      rank_by:              {type: enum, values: [auto, stat, signed_p], default: auto}
      rrho_step:            {type: integer, default: null}
      rrho_correction:      {type: enum, values: [BY, none], default: BY}
      compare_pathways:     {type: bool, default: true}
      pathway_padj_cutoff:  {type: number, default: 0.05}
      gene_set_collections: {type: list, values: [H, GO:BP, GO:MF, GO:CC, REACTOME, KEGG, WIKIPATHWAYS], default: [H, GO:BP, REACTOME, KEGG]}
      gene_set_source:      {type: enum, values: [msigdbr, gmt, both], default: msigdbr}
      gmt_files:            {type: list, default: []}
      gene_set_min_size:    {type: integer, default: 15}
      gene_set_max_size:    {type: integer, default: 500}
      n_heatmap_pathways:   {type: integer, default: 30}
      n_label_genes:        {type: integer, default: 10}
      plot_palette:         {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito}
      up_colour:            {type: colour, default: "#D55E00"}
      down_colour:          {type: colour, default: "#0072B2"}
    outputs:
      C01_harmonise_studies/studies.json: "Per study: comparison, organism, genes matched, significant up/down; match method, ranking, rule"
      C01_harmonise_studies/matched_genes.csv: One row per gene, log2FC / padj / direction in every study
      "C02_compare_genes/<a>_vs_<b>/genes_compared.csv": "Shared genes with both studies' results and a category (both same direction, opposite, one only, neither)"
      "C02_compare_genes/<a>_vs_<b>/fc_scatter.png": Fold-change scatter plot
      C02_compare_genes/gene_comparison.json: Correlations, overlaps, Fisher tests, Jaccard, direction agreement per pair
      C02_compare_genes/genes_significant_in_several_studies.csv: Genes significant in two or more studies
      "C03_rrho/<a>_vs_<b>/rrho_map.png": RRHO map
      C03_rrho/rrho_summary.json: Strongest overlap per quadrant and the overall pattern
      "C04_compare_pathways/<collection>/pathways_all_studies.csv": NES and padj of every pathway in every study
      "C04_compare_pathways/<collection>/nes_heatmap.png": Top pathways across studies
      C04_compare_pathways/pathway_comparison.json: NES correlation and shared pathways per pair
      C05_compare_report/methods.md: Methods text
      run_summary.json: Headline results and warnings
    answers:
      "do the studies agree": [run_summary.json, C02_compare_genes/gene_comparison.json, C03_rrho/rrho_summary.json]
      "which genes change in both studies": ["C02_compare_genes/<a>_vs_<b>/genes_compared.csv", C02_compare_genes/genes_significant_in_several_studies.csv]
      "which pathways are shared": ["C04_compare_pathways/<collection>/pathways_all_studies.csv", C04_compare_pathways/pathway_comparison.json]
    site:
      attach_to: page                # its own page on the site (Compare studies), not a tab on a run
      page: compare
      title: Compare studies

  later:
    description: >
      Not used by the website yet (for when FASTQ/BAM files arrive through the
      Globus upload): fastp QC and trimming, read length, STAR alignment, Salmon,
      tximport gene counts, rMATS, sashimi plots, and run_upstream.R to run them
      all from one config. See later/README.md.
    entry_point: later/scripts/run_upstream.R
    folder: later/
    site:
      attach_to: none                # not on the website yet (FASTQ input comes with the Ada / Globus integration)

# Where to find the answer to common questions (paths relative to the run folder)
answers:
  "what was compared / which design": [run_summary.json, 04_differential_expression/de_summary.json]
  "settings, thresholds, tools, versions": [provenance.json, 01_validate_inputs/resolved_params.yaml, 04_differential_expression/de_summary.json]
  "is gene X significant / its fold change": [04_differential_expression/de_results_all.csv]
  "why is a gene's padj NA": ["04_differential_expression/de_results_all.csv (column note)"]
  "how many DEGs / top genes": [04_differential_expression/de_summary.json]
  "sample quality / failed samples": [02_qc/qc_metrics.csv, 02_qc/qc_summary.json]
  "outliers, mislabels, batch effects": [03_exploratory/exploratory_summary.json, 03_exploratory/outlier_flags.csv]
  "pathways": [06_enrichment/enrichment_summary.json, "06_enrichment/<collection>/gsea.csv", "06_enrichment/<collection>/ora_up.csv", "06_enrichment/<collection>/ora_down.csv"]
  "problems with the input files": [01_validate_inputs/validation_report.json]
  "methods text for a paper": [07_report/methods.md]
  "what a statistical term means / why a method was chosen": [docs/METHODS.md]
