# =============================================================================
# manifest/tools.yaml  --  machine-readable description of the code bank
# =============================================================================
# The AI agent reads this file to learn which analyses exist, which parameters
# each one accepts (with types, defaults and allowed values), what each one
# writes, and where to look to answer questions. People can read it too.
#
# Rules for the agent
#   * Run analyses ONLY through these entry points; never write new analysis code.
#   * Start every analysis with `run_pipeline`. It creates a new run folder.
#   * To change a setting after a run, start a NEW run with --based_on <old run>
#     and --set "<param>=<value>"; never edit an existing run folder.
#   * Show the user the proposed condition / reference / test / covariates and
#     wait for confirmation before running steps 2-7.
#   * Answer questions about results from the files listed under `answers`,
#     not from memory.
#   * Never replace a method listed under `methods`. Agents may change the
#     parameters below (covariates, cutoffs, plot colours and shapes, ...), not
#     the statistics: e.g. no edgeR or limma instead of DESeq2. Custom code may
#     only use the methods in `methods.allowed` and must not use
#     `methods.not_allowed`.
#
# Parameter types: path, string, number, integer, bool, enum (one of `values`),
# list (of text; `values` = allowed items), column (a column of the sample
# table), colour (hex such as "#D55E00" or an R colour name).
#
# When you add a script: add an entry under `steps`, list every parameter it
# reads, and add its outputs. Keep `version` in step with R/utils.R.
# =============================================================================

version: 0.4.0
language: R (>= 4.3)
defaults_file: config/default_params.yaml
runs_folder: runs/

entry_points:
  run_pipeline:
    script: scripts/run_pipeline.R
    description: Create a run folder and run steps 1-7 (or a chosen subset).
    command_examples:
      - Rscript scripts/run_pipeline.R --config <run_config.yaml>
      - Rscript scripts/run_pipeline.R --counts_file <counts> --metadata_file <metadata> --condition <col> --reference_level <ref> --test_level <test> --run_name <label>
      - Rscript scripts/run_pipeline.R --config <run_config.yaml> --steps 1       # validation only
      - Rscript scripts/run_pipeline.R --based_on runs/<run_id> --set "log2fc_cutoff=0.58"
      - Rscript scripts/run_pipeline.R --run_dir runs/<run_id> --steps 6-7        # resume, same parameters
    options:
      config:     {type: path, description: Run config YAML with the values that differ from the defaults}
      based_on:   {type: path, description: Earlier run folder whose parameters are copied}
      run_dir:    {type: path, description: Existing run folder to resume (no parameter changes allowed)}
      runs_dir:   {type: path, default: runs/}
      run_name:   {type: string, description: Label in the run folder name}
      steps:      {type: string, default: "1-7", description: "e.g. 1-7, 1, 4-5, 1,2,3"}
      set:        {type: string, description: "Any parameter overrides, 'key=value;key2=[a, b]' (values parsed as YAML)"}
    exit_codes: {0: all critical steps passed, 1: a critical step failed (read the step log)}
    writes:
      - params.yaml          # parameters requested
      - inputs/              # copies of the input files
      - logs/<step>.log      # full console output of each step
      - provenance/<step>.json
      - provenance.json      # code commit, R and package versions, parameters, checksums, timings
      - run_summary.json     # headline results and warnings: read this first
  setup_environment:
    script: scripts/00_setup_environment.R
    description: Install and check packages (--check to only check).
  make_example_data:
    script: scripts/make_example_data.R
    description: Write the airway and pasilla example inputs into data/example/.
  tests:
    script: tests/run_tests.R
    description: End-to-end tests; --skip_enrichment when offline.

steps:
  - id: 1
    name: 01_validate_inputs
    script: scripts/01_validate_inputs.R
    critical: true
    description: >
      Read and check the counts and metadata files, explain problems in plain
      language, resolve open parameters (reference group, organism, ID type,
      filter threshold) and write clean aligned inputs.
    parameters:
      counts_file:        {type: path, required: true}
      metadata_file:      {type: path, required: true}
      gene_id_column:     {type: string, default: null, description: null = first column}
      sample_id_column:   {type: string, default: null, description: null = first column}
      condition:          {type: string, default: condition}
      reference_level:    {type: string, default: null, description: null = guessed from control-like names and flagged}
      test_level:         {type: string, default: null, description: null = the other group when there are exactly 2}
      covariates:         {type: list, default: [], description: Adjusted for in the model; pairing column goes here}
      organism:           {type: enum, values: [auto, human, mouse, other], default: auto}
      exclude_samples:    {type: list, default: [], description: Sample IDs left out of the analysis}
      duplicate_gene_ids: {type: enum, values: [sum, first, error], default: sum}
      round_counts:       {type: bool, default: true}
      min_library_size:   {type: number, default: 1000000}
      min_replicates_warn: {type: integer, default: 3}
      min_count:          {type: integer, default: 10}
      min_samples:        {type: integer, default: null, description: null = size of the smaller compared group}
    outputs:
      validation_report.json: Every check with id, status (pass/warning/fail) and message
      validation_report.md:   Same, readable
      counts_validated.csv:   Clean integer counts
      metadata_validated.csv: Aligned metadata (first column sample_id)
      resolved_params.yaml:   Final parameters used by all later steps
    check_ids: [files_found, counts_readable, gene_id_column, annotation_columns, numeric_columns, excluded_samples, missing_values,
                negative_values, count_values, ensembl_versions, duplicate_gene_ids, all_zero_genes,
                library_sizes, metadata_readable, sample_id_column, duplicate_samples, sample_matching,
                condition_column, condition_values, reference_level, test_level, replicates,
                covariates, design_full_rank, residual_df, level_names, gene_ids_organism]

  - id: 2
    name: 02_qc
    script: scripts/02_qc.R
    critical: true
    description: Library sizes, detected genes, count distributions and per-sample QC flags.
    parameters:
      min_library_size: {type: number}
      min_count: {type: integer}
      min_samples: {type: integer}
      plot_palette:       {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito, description: Group colours in every figure}
      group_colours:      {type: list, default: [], description: "Colour for single groups, entries like WT=#000000"}
    outputs:
      qc_metrics.csv:     One row per sample (library size, detected genes, % zeros, flags)
      qc_summary.json:    Totals, filter result, flags
      library_sizes.png:  Reads per sample
      detected_genes.png: Detected genes per sample
      logcpm_boxplot.png: Expression distribution per sample
      logcpm_density.png: Expression density per sample

  - id: 3
    name: 03_exploratory
    script: scripts/03_exploratory.R
    critical: true
    description: VST (blind), PCA on top variable genes, sample-distance heatmap, mislabel/outlier flags.
    parameters:
      n_top_variable_genes: {type: integer, default: 500}
      plot_palette:       {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito, description: Group colours in every figure}
      group_colours:      {type: list, default: [], description: "Colour for single groups, entries like WT=#000000"}
      pca_colour_by:      {type: column, default: null, description: Sample-table column that colours the PCA; null = the compared groups}
      pca_shape_by:       {type: column, default: null, description: "Column for point shapes (at most 6 values); null = first covariate; none = no shapes"}
      pca_label_samples:  {type: bool, default: true, description: Sample names next to the PCA points}
    outputs:
      pca_plot.png:                PC1 vs PC2 coloured by group (shape = first covariate)
      "pca_by_<covariate>.png":      PC1 vs PC2 coloured by each covariate
      pca_scree.png:               Variance explained per PC
      sample_distance_heatmap.png: Euclidean distances between samples
      pca_coordinates.csv:         PC scores with metadata
      pca_variance.csv:            Percent variance per PC
      outlier_flags.csv:           clusters_with_other_group / far_from_own_group per sample
      exploratory_summary.json:    Variance explained, how much group/covariates explain PC1/PC2, flags
      vst_counts.csv.gz:           VST matrix
      size_factors.csv:            DESeq2 size factors

  - id: 4
    name: 04_differential_expression
    script: scripts/04_differential_expression.R
    critical: true
    description: DESeq2 Wald test, test vs reference, BH-adjusted p-values, shrunken log2FC, annotation.
    parameters:
      padj_cutoff:   {type: number, default: 0.05}
      log2fc_cutoff: {type: number, default: 1, description: Applied to the shrunken log2FC}
      lfc_shrinkage: {type: enum, values: [apeglm, ashr, normal, none], default: apeglm}
      min_count:     {type: integer, default: 10}
      min_samples:   {type: integer}
      seed:          {type: integer, default: 42}
    outputs:
      de_results_all.csv:         "gene_id, gene_symbol, gene_name, entrez_id, baseMean, log2FoldChange (shrunken), lfcSE, log2FoldChange_unshrunken, stat, pvalue, padj, mean_normalized_<ref>, mean_normalized_<test>, significant, direction (up/down/not significant), note"
      de_results_significant.csv: Significant genes only
      normalized_counts.csv:      Size-factor normalised counts
      de_summary.json:            Design, comparison, thresholds, counts, shrinkage used, top genes
      dispersion_plot.png:        DESeq2 dispersion fit
      dds.rds:                    Fitted DESeqDataSet

  - id: 5
    name: 05_de_plots
    script: scripts/05_de_plots.R
    critical: true
    description: Volcano, MA, top-DEG heatmap, p-value histogram.
    parameters:
      n_label_volcano:     {type: integer, default: 15, description: Top genes by padj labelled on the volcano plot}
      volcano_label_genes: {type: list, default: [], description: Label exactly these genes instead (symbols or IDs)}
      n_heatmap_genes:     {type: integer, default: 50}
      up_colour:           {type: colour, default: "#D55E00", description: Genes higher in the test group}
      down_colour:         {type: colour, default: "#0072B2", description: Genes lower in the test group}
      plot_palette:       {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito, description: Group colours in every figure}
      group_colours:      {type: list, default: [], description: "Colour for single groups, entries like WT=#000000"}
    outputs:
      volcano_plot.png: "shrunken log2FC vs -log10 p-value; labels = volcano_label_genes, or the top n_label_volcano"
      ma_plot.png: mean expression vs log2FC
      heatmap_top_degs.png: row z-scores of top DEGs
      pvalue_histogram.png: p-value distribution
      plots_summary.json: "labelled genes, requested genes not found, colours, heatmap details"

  - id: 6
    name: 06_enrichment
    script: scripts/06_enrichment.R
    critical: false
    description: ORA (up and down genes separately) and pre-ranked GSEA with fgsea, per gene-set collection.
    parameters:
      run_enrichment:          {type: bool, default: true}
      gene_set_source:         {type: enum, values: [msigdbr, gmt, both], default: msigdbr}
      gene_set_collections:    {type: list, values: [H, GO:BP, GO:MF, GO:CC, REACTOME, KEGG, WIKIPATHWAYS], default: [H, GO:BP, REACTOME, KEGG]}
      gmt_files:               {type: list, default: []}
      gene_set_min_size:       {type: integer, default: 15}
      gene_set_max_size:       {type: integer, default: 500}
      enrichment_padj_cutoff:  {type: number, default: 0.05}
      min_genes_for_ora:       {type: integer, default: 5}
    outputs:
      "<collection>/ora_up.csv":   pathway, pvalue, padj, n_overlap, set_size, fold_enrichment, overlap_genes
      "<collection>/ora_down.csv": same, for down genes
      "<collection>/gsea.csv":     pathway, pvalue, padj, ES, NES, set_size, direction, leading_edge_genes
      "<collection>/*.png":        dot plots (ORA) and NES bar plot (GSEA)
      enrichment_summary.json:     methods, versions, counts and top hits per collection (or status skipped + reason)

  - id: 7
    name: 07_report
    script: scripts/07_report.R
    critical: false
    description: Methods paragraph from recorded parameters and versions, plus a self-contained HTML report.
    parameters: {}
    outputs:
      methods.md:  Methods text and references
      report.html: Full report (needs pandoc)

# The statistical methods of this code bank. Agents (and the code they write)
# may change parameters, never these methods. `not_allowed` lists common
# alternatives that would change the analysis; each says what to use instead.
methods:
  allowed:
    normalisation:           {method: "DESeq2 median-of-ratios size factors", packages: [DESeq2]}
    transformation:          {method: "DESeq2 variance-stabilising transformation (vst, blind)", packages: [DESeq2]}
    exploratory:             {method: "PCA (prcomp) on the most variable VST genes; Euclidean sample distances", packages: [stats]}
    differential_expression: {method: "DESeq2 negative binomial GLM, Wald test", packages: [DESeq2]}
    fold_change_shrinkage:   {method: "apeglm (default), ashr or normal", packages: [apeglm, ashr, DESeq2]}
    multiple_testing:        {method: "Benjamini-Hochberg adjusted p-values", packages: [stats]}
    pathway_enrichment:      {method: "fgsea pre-ranked GSEA and fgsea::fora over-representation", packages: [fgsea, msigdbr]}
    alternative_splicing:    {method: "rMATS likelihood-ratio test on PSI, BH FDR per event type; read-coverage filter (splicing module)", packages: [rMATS]}
    isoform_expression:      {method: "DESeq2 on tximport transcript counts with length offsets (isoform module, DEI)", packages: [DESeq2, tximport]}
    isoform_usage:           {method: "DEXSeq on dtuScaledTPM transcript counts with stageR two-stage FDR (isoform module, DUI)", packages: [DEXSeq, stageR, tximport]}
    read_processing:         {method: "fastp trimming and QC, STAR alignment, Salmon quantification, tximport (later/)", packages: [fastp, STAR, salmon, samtools, tximport]}
    gene_sets:               {method: "MSigDB through msigdbr, or user GMT files", packages: [msigdbr]}
  not_allowed:
    - {name: edgeR,          detect: [edgeR, DGEList, calcNormFactors, glmQLFit, glmQLFTest, exactTest, glmLRT], instead: "DESeq2 (the code bank's differential expression)"}
    - {name: limma / voom,   detect: [limma, voom, lmFit, eBayes, topTable, removeBatchEffect], instead: "DESeq2 with covariates in the design"}
    - {name: other DE tools, detect: [NOISeq, baySeq, sleuth, EBSeq, DSS, pydeseq2, DESeq2Py, diffxpy], instead: "DESeq2 (the code bank's differential expression)"}
    - {name: per-gene t / rank tests, detect: [t.test, wilcox.test, ttest_ind, ttest_rel, mannwhitneyu, wilcoxon, ranksums, kruskal], instead: "DESeq2 for gene-level tests"}
    - {name: batch correction of counts, detect: [ComBat, ComBat_seq, ComBat-seq, RUVSeq, RUVg, svaseq], instead: "add the batch column as a covariate"}
    - {name: other enrichment tools, detect: [clusterProfiler, enricher, enrichGO, enrichKEGG, gseGO, gseKEGG, ReactomePA, enrichR, enrichr, gseapy, GSVA, gsva, ssgsea, topGO, goseq, GOstats, gage, decoupler, g:Profiler, gprofiler], instead: "fgsea (GSEA and fora), as in step 06"}
    - {name: other splicing tools, detect: [leafcutter, MAJIQ, majiq, SUPPA, suppa, JunctionSeq, VAST-tools, vast-tools, SplAdder], instead: "rMATS output with the splicing module (splicing/scripts/run_splicing.R)"}
    - {name: other isoform-usage tools, detect: [DRIMSeq, dmTest, IsoformSwitchAnalyzeR, isoformSwitchTestDEXSeq, BayesDRIMSeq, satuRn, fishpond, swish], instead: "DEXSeq + stageR in the isoform module (isoforms/scripts/run_isoforms.R)"}
    - {name: other normalisation, detect: [TPM, RPKM, FPKM, cpm(, rpkm(, quantile normalization, normalize.quantiles], instead: "DESeq2 size factors / VST for analysis; other units only for display, labelled as such"}

# Additional modules. Each has its own entry point, defaults and run folders, and
# follows the same rules as the main pipeline (parameters only, methods fixed).
modules:
  splicing:
    description: >
      Differential alternative splicing from rMATS output tables (SE, MXE, A3SS,
      A5SS, RI): input check, significant events (FDR, dPSI, read coverage),
      figures, pathway over-representation of spliced genes, methods text.
      Starts from rMATS tables the way the main pipeline starts from counts.
    entry_point: splicing/scripts/run_splicing.R
    defaults_file: splicing/config/default_params.yaml
    tests: splicing/tests/run_splicing_tests.R
    command_examples:
      - Rscript splicing/scripts/run_splicing.R --rmats_dir <rmats_output> --group_1_name KO --group_2_name WT --run_name ko_splicing
      - Rscript splicing/scripts/run_splicing.R --based_on runs/<run_id> --set "delta_psi_cutoff=0.2"
    steps:
      - {id: 1, name: S01_validate_rmats, critical: true, description: Check the rMATS tables (columns, statistics present, replicates, group names) and standardise them}
      - {id: 2, name: S02_splicing_results, critical: true, description: "Significant events: FDR, |dPSI| and read coverage; tables and figures"}
      - {id: 3, name: S03_splicing_enrichment, critical: false, description: fgsea::fora on genes with significant events (universe = genes with tested events)}
      - {id: 4, name: S04_splicing_report, critical: false, description: Methods paragraph}
    parameters:
      rmats_dir:            {type: path, required: true, description: Folder with SE.MATS.JCEC.txt etc.}
      count_type:           {type: enum, values: [JCEC, JC], default: JCEC}
      event_types:          {type: list, values: [SE, MXE, A3SS, A5SS, RI], default: [SE, MXE, A3SS, A5SS, RI]}
      group_1_name:         {type: string, default: null, description: rMATS sample 1 (--b1), the test group}
      group_2_name:         {type: string, default: null, description: rMATS sample 2 (--b2), the reference group}
      group_1_samples:      {type: list, default: [], description: Sample names in --b1 order (plots)}
      group_2_samples:      {type: list, default: [], description: Sample names in --b2 order (plots)}
      organism:             {type: enum, values: [auto, human, mouse, other], default: auto}
      fdr_cutoff:           {type: number, default: 0.05}
      delta_psi_cutoff:     {type: number, default: 0.1}
      min_reads_per_sample: {type: number, default: 10, description: Mean inclusion + skipping reads per sample, in both groups}
      n_label_events:       {type: integer, default: 10}
      n_heatmap_events:     {type: integer, default: 40}
      plot_palette:         {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito}
      group_colours:        {type: list, default: []}
      up_colour:            {type: colour, default: "#D55E00"}
      down_colour:          {type: colour, default: "#0072B2"}
      run_enrichment:       {type: bool, default: true}
      gene_set_source:      {type: enum, values: [msigdbr, gmt, both], default: msigdbr}
      gene_set_collections: {type: list, values: [H, GO:BP, GO:MF, GO:CC, REACTOME, KEGG, WIKIPATHWAYS], default: [H, GO:BP, REACTOME, KEGG]}
      gmt_files:            {type: list, default: []}
      gene_set_min_size:    {type: integer, default: 15}
      gene_set_max_size:    {type: integer, default: 500}
      enrichment_padj_cutoff: {type: number, default: 0.05}
      min_genes_for_ora:    {type: integer, default: 5}
      rmats_version:        {type: string, default: null}
      de_run:               {type: path, default: null, description: Main-pipeline run of the same comparison (splicing vs expression)}
    outputs:
      S01_validate_rmats/validation_report.json: Every check with id, status and message
      S01_validate_rmats/events_validated.csv:   All events, standard columns (1-based coordinates)
      S02_splicing_results/splicing_events_all.csv: "Every event with passes_coverage, significant, direction (up = more inclusion in group 1)"
      S02_splicing_results/splicing_events_significant.csv: Significant events, strongest first
      S02_splicing_results/splicing_summary.json: Counts per event type and direction, top events
      S02_splicing_results/*.png: event_counts, dpsi_volcano, psi_scatter, dpsi_distribution, top_events_heatmap
      S02_splicing_results/splicing_vs_expression.csv: "With de_run: per gene, splicing only / expression only / both"
      "S03_splicing_enrichment/<collection>/ora_*.csv": Pathways among spliced genes (all events, only more / only less inclusion, per event type)
      S04_splicing_report/methods.md: Methods text
      run_summary.json: Headline results and warnings
    answers:
      "which events / genes are differentially spliced": [S02_splicing_results/splicing_events_significant.csv, S02_splicing_results/splicing_summary.json]
      "is gene X differentially spliced": [S02_splicing_results/splicing_events_all.csv]
      "pathways among spliced genes": [S03_splicing_enrichment/enrichment_summary.json]
  isoforms:
    description: >
      Differential isoform expression (DEI: DESeq2 per transcript) and differential
      isoform usage (DUI: DEXSeq on transcript shares within genes, stageR
      two-stage FDR) from Salmon or kallisto transcript quantification.
    entry_point: isoforms/scripts/run_isoforms.R
    defaults_file: isoforms/config/default_params.yaml
    tests: isoforms/tests/run_isoform_tests.R
    command_examples:
      - Rscript isoforms/scripts/run_isoforms.R --quant_dir <salmon> --metadata_file samples.csv --gtf_file genes.gtf --condition genotype --reference_level WT --test_level KO
      - Rscript isoforms/scripts/run_isoforms.R --based_on runs/<run_id> --set "min_delta_usage=0.2"
    steps:
      - {id: 1, name: I01_validate_isoforms, critical: true, description: Check sample table, quantification files, transcript-to-gene mapping and design; import with tximport}
      - {id: 2, name: I02_differential_isoform_expression, critical: true, description: "DEI: DESeq2 per transcript (same filter, design, test and shrinkage as step 04)"}
      - {id: 3, name: I03_differential_isoform_usage, critical: false, description: "DUI: DEXSeq on transcript shares within genes, stageR gene-then-transcript FDR"}
      - {id: 4, name: I04_isoform_report, critical: false, description: Methods paragraph}
    parameters:
      quant_dir:          {type: path, required: true, description: "<sample>/quant.sf (Salmon) or <sample>/abundance.tsv (kallisto)"}
      quant_type:         {type: enum, values: [salmon, kallisto], default: salmon}
      metadata_file:      {type: path, required: true}
      gtf_file:           {type: path, default: null}
      tx2gene_file:       {type: path, default: null}
      ignore_tx_version:  {type: bool, default: false}
      condition:          {type: column, default: condition}
      reference_level:    {type: string, default: null}
      test_level:         {type: string, default: null}
      covariates:         {type: list, default: []}
      exclude_samples:    {type: list, default: []}
      min_count:          {type: integer, default: 10}
      min_samples:        {type: integer, default: null}
      lfc_shrinkage:      {type: enum, values: [apeglm, ashr, normal, none], default: apeglm}
      padj_cutoff:        {type: number, default: 0.05}
      log2fc_cutoff:      {type: number, default: 1}
      min_feature_count:  {type: number, default: 10}
      min_feature_prop:   {type: number, default: 0.1}
      min_gene_count:     {type: number, default: 10}
      dui_alpha:          {type: number, default: 0.05}
      min_delta_usage:    {type: number, default: 0.1}
      threads:            {type: integer, default: 1}
      n_usage_plots:      {type: integer, default: 12}
      plot_palette:       {type: enum, values: [okabe_ito, set2, viridis, greys], default: okabe_ito}
      up_colour:          {type: colour, default: "#D55E00"}
      down_colour:        {type: colour, default: "#0072B2"}
    outputs:
      I02_differential_isoform_expression/dei_results_all.csv: "Per transcript: gene, log2FoldChange (shrunken), padj, mean TPM per group, significant, direction"
      I02_differential_isoform_expression/dei_volcano.png: Volcano plot of transcripts
      I03_differential_isoform_usage/dui_transcripts_all.csv: "Per transcript: share of its gene in each group, delta_usage, gene_padj, transcript_padj, significant"
      I03_differential_isoform_usage/dui_genes.csv: "Per gene: gene_padj, transcripts gaining / losing share, isoform_switch"
      I03_differential_isoform_usage/dui_top_genes_usage.png: Transcript shares for the top genes
      I04_isoform_report/methods.md: Methods text
    answers:
      "is a transcript of gene X up or down": [I02_differential_isoform_expression/dei_results_all.csv]
      "does gene X switch isoforms": [I03_differential_isoform_usage/dui_genes.csv, I03_differential_isoform_usage/dui_transcripts_all.csv]
  later:
    description: >
      Not used by the website yet (for when FASTQ/BAM files arrive through the
      Globus upload): fastp QC and trimming, read length, STAR alignment, Salmon,
      tximport gene counts, rMATS, sashimi plots, and run_upstream.R to run them
      all from one config. See later/README.md.
    entry_point: later/scripts/run_upstream.R
    folder: later/

# Where to find the answer to common questions (paths relative to the run folder)
answers:
  "what was compared / which design": [run_summary.json, 04_differential_expression/de_summary.json]
  "settings, thresholds, tools, versions": [provenance.json, 01_validate_inputs/resolved_params.yaml, 04_differential_expression/de_summary.json]
  "is gene X significant / its fold change": [04_differential_expression/de_results_all.csv]
  "why is a gene's padj NA": ["04_differential_expression/de_results_all.csv (column note)"]
  "how many DEGs / top genes": [04_differential_expression/de_summary.json]
  "sample quality / failed samples": [02_qc/qc_metrics.csv, 02_qc/qc_summary.json]
  "outliers, mislabels, batch effects": [03_exploratory/exploratory_summary.json, 03_exploratory/outlier_flags.csv]
  "pathways": [06_enrichment/enrichment_summary.json, "06_enrichment/<collection>/gsea.csv", "06_enrichment/<collection>/ora_up.csv", "06_enrichment/<collection>/ora_down.csv"]
  "problems with the input files": [01_validate_inputs/validation_report.json]
  "methods text for a paper": [07_report/methods.md]
  "what a statistical term means / why a method was chosen": [docs/METHODS.md]
